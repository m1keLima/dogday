<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Day</title>
<style>
  :root{
    --ink:#2b2b33;
    --ink-soft:#5f5f6d;
    --paper:#fff6ea;
    --card:#fffdf9;
    --line:#e6d8c6;
    --accent:#e8743c;
    --accent-2:#f0b429;
    --good:#4fa86b;
    --bad:#d9534f;
    --shadow:0 6px 0 rgba(43,43,51,.10);
    --coat:#d9a441; --coat-dark:#b9862e; --belly:#f6e2bd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:700;
    display:flex;flex-direction:column;align-items:center;
    padding:16px;gap:14px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:880px;display:flex;flex-direction:column;gap:14px}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--card);border:3px solid var(--ink);border-radius:18px;
    padding:10px 14px;box-shadow:var(--shadow);
  }
  .clock{font-size:26px;letter-spacing:.5px;min-width:112px}
  .phase{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px}
  .daybar{flex:1;min-width:140px;height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
  .daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#e8743c,#6b4a8f)}
  .where{font-size:14px;background:var(--ink);color:#fff;padding:5px 12px;border-radius:99px}
  .wxb{font-size:14px;border:2px solid var(--ink);border-radius:14px;padding:3px 11px;background:#fff;line-height:1.3}
  .wxb .wxnext{font-size:11px;color:var(--ink-soft);font-weight:800}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:9px 11px;box-shadow:var(--shadow)}
  .stat .k{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)}
  .stat .k b{color:var(--ink);font-size:13px}
  .bar{margin-top:6px;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
  .bar i{display:block;height:100%;width:50%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .s-energy i{background:#f0b429} .s-happy i{background:#e8743c}
  .s-full i{background:#7a9e4b}   .s-clean i{background:#57a9d6}
  .stat.pulse{animation:pulse .45s ease 3}
  @keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.05) rotate(-1deg)}}
  .stat.low .k b{color:var(--bad)}

  /* ---------- scene ---------- */
  .scene{
    position:relative;height:330px;border:3px solid var(--ink);border-radius:22px;
    overflow:hidden;box-shadow:var(--shadow);isolation:isolate;
    background:linear-gradient(#bfe6f5,#e7f4f7);
    transition:background 1.2s linear;
  }
  #stars{position:absolute;left:0;right:0;top:0;height:60%;opacity:0;transition:opacity 1.2s;pointer-events:none;
    background-image:
      radial-gradient(circle at 6% 14%,#fff 1.4px,transparent 2.2px),radial-gradient(circle at 15% 40%,#fff 1px,transparent 1.8px),
      radial-gradient(circle at 24% 10%,#fff 1.6px,transparent 2.4px),radial-gradient(circle at 33% 30%,#fff 1px,transparent 1.8px),
      radial-gradient(circle at 44% 8%,#fff 1.3px,transparent 2px),radial-gradient(circle at 52% 36%,#fff 1px,transparent 1.8px),
      radial-gradient(circle at 61% 16%,#fff 1.6px,transparent 2.4px),radial-gradient(circle at 70% 42%,#fff 1px,transparent 1.8px),
      radial-gradient(circle at 78% 22%,#fff 1.3px,transparent 2px),radial-gradient(circle at 92% 12%,#fff 1.5px,transparent 2.3px),
      radial-gradient(circle at 96% 38%,#fff 1px,transparent 1.8px),radial-gradient(circle at 38% 52%,#fff 1px,transparent 1.8px)}
  .sun{position:absolute;left:14%;width:64px;height:64px;border-radius:50%;
    background:#fff3c4;box-shadow:0 0 44px 18px rgba(255,236,160,.75);transition:top 1s linear,background 1s linear,opacity 1s}
  #moon{position:absolute;right:10%;top:22px;font-size:40px;opacity:0;transition:opacity 1.2s;pointer-events:none}
  #clouds{position:absolute;inset:0;pointer-events:none}
  .cloud{position:absolute;left:0;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.92;
    animation:drift linear infinite;transform-origin:0 50%}
  .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud:before{width:60px;height:60px;left:18px;top:-28px}
  .cloud:after{width:46px;height:46px;left:60px;top:-18px}
  .cloud.grey{background:#c9ced8}
  .cloud.dark{background:#7c8394;opacity:.95}
  @keyframes drift{from{transform:translateX(-220px) scale(var(--s,1))}to{transform:translateX(1100px) scale(var(--s,1))}}

  #backdrop{position:absolute;left:0;right:0;bottom:96px;width:100%;height:calc(100% - 96px);display:block}
  #backdrop .win{fill:var(--win,#cfe3ee);transition:fill 1s}
  #backdrop .skywin{fill:var(--skyTop,#bfe6f5)}
  #backdrop .glow{fill:#ffe9a0;opacity:var(--glow,0);transition:opacity 1s}

  .ground{position:absolute;left:0;right:0;bottom:0;height:96px;background:#7fb36a;border-top:3px solid rgba(43,43,51,.25)}
  .ground:after{content:"";position:absolute;left:0;right:0;top:0;height:0;background:#f4f8fc;transition:height 2.5s;border-radius:0 0 40% 40%/0 0 30% 30%}
  .wx-snow:not(.indoor) .ground:after{height:58%}
  .home .ground{background:#8dbd74}
  .park .ground{background:#7fb36a}
  .beach .ground{background:#f0dcae}
  .mountains .ground{background:#8da86e}
  .lake .ground{background:#86b86b}
  .pool .ground{background:repeating-linear-gradient(90deg,#e6eff4 0 38px,#cddce5 38px 41px)}
  .museum .ground{background:repeating-linear-gradient(90deg,#bb8b59 0 70px,#a67848 70px 73px)}
  .zoo .ground{background:#d2bd8c}

  #gitems,#props{position:absolute;inset:0;pointer-events:none}
  .gi{position:absolute;line-height:1;user-select:none}
  .puddle{position:absolute;display:none;height:11px;border-radius:50%;background:rgba(84,132,184,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
  .wx-rain:not(.indoor) .puddle,.wx-storm:not(.indoor) .puddle{display:block}
  .prop{position:absolute;bottom:80px;font-size:54px;line-height:1;user-select:none}
  .prop.small{font-size:34px}
  .wx-wind .prop.sway,.wx-storm .prop.sway{animation:sway 1.3s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}

  #stage{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,.7,.3,1)}
  #dog{width:250px;height:auto;display:block;overflow:visible}

  #wx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .drop{position:absolute;top:-30px;width:2px;height:22px;background:linear-gradient(rgba(220,235,255,0),rgba(220,235,255,.95));animation:fall linear infinite}
  @keyframes fall{to{transform:translate(-50px,390px)}}
  .flake{position:absolute;top:-20px;color:#fff;animation:snowfall linear infinite;text-shadow:0 0 2px rgba(0,0,0,.15)}
  @keyframes snowfall{0%{transform:translate(0,0)}50%{transform:translate(22px,180px)}100%{transform:translate(-12px,380px)}}
  .leaf{position:absolute;left:-40px;font-size:20px;animation:blow linear infinite}
  @keyframes blow{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(520px,-40px) rotate(360deg)}100%{transform:translate(1050px,30px) rotate(720deg)}}
  .gust{position:absolute;left:-120px;height:2px;width:90px;border-radius:2px;background:rgba(255,255,255,.75);animation:gust linear infinite}
  @keyframes gust{to{transform:translateX(1100px)}}

  #tint{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;transition:background 1.2s linear}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .wx-storm:not(.indoor) #flash{animation:flash 7s infinite}
  @keyframes flash{0%,86%,100%{opacity:0}87%{opacity:.8}88%{opacity:.1}89.5%{opacity:.7}92%{opacity:0}}
  .indoor #sun,.indoor #moon,.indoor #stars,.indoor #clouds,.indoor #wx{display:none}

  .bubble{
    position:absolute;left:50%;bottom:250px;transform:translateX(-50%);
    background:#fff;border:3px solid var(--ink);border-radius:16px;
    padding:8px 14px;font-size:15px;max-width:360px;text-align:center;
    box-shadow:var(--shadow);opacity:0;transition:opacity .3s, transform .3s;pointer-events:none
  }
  .bubble.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .bubble.no{border-color:var(--bad);color:var(--bad)}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;
    border:8px solid transparent;border-top-color:var(--ink)}

  .float{position:absolute;font-size:26px;pointer-events:none;animation:floatup 1.5s ease-out forwards}
  @keyframes floatup{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-110px) scale(1.25)}}
  .thrown{position:absolute;left:54%;bottom:150px;font-size:30px;pointer-events:none;animation:arc 1.3s ease-out forwards}
  @keyframes arc{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    40%{transform:translate(min(30vw,280px),-120px) rotate(300deg)}
    60%{transform:translate(min(32vw,300px),50px) rotate(420deg)}
    100%{transform:translate(0,20px) rotate(640deg);opacity:0}}
  .falling{position:absolute;top:-30px;font-size:26px;pointer-events:none;animation:dropin 1.4s ease-in forwards}
  @keyframes dropin{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(190px) scale(.6);opacity:0}}

  /* ---------- quests ---------- */
  .quests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quest{border:3px dashed var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
  .quest .qt{flex:1 1 170px}
  .quest button{margin-left:auto}
  .quest.done{border-style:solid;border-color:var(--good);background:#f3fbf5}
  .quest .qi{font-size:34px;line-height:1}
  .quest .qt{flex:1;font-size:15px;font-weight:700;line-height:1.45}
  .quest .qt b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft)}
  .quest .clue{font-size:17px;font-weight:800;color:var(--ink)}
  .quest button{white-space:nowrap}

  /* ---------- controls ---------- */
  .panel{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 9px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft)}
  .btns{display:flex;flex-wrap:wrap;gap:9px}
  button{
    font:inherit;font-size:15px;cursor:pointer;
    background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;
    padding:9px 14px;box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;
  }
  button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  button .t{display:block;font-size:11px;font-weight:800;color:var(--ink-soft);letter-spacing:.4px}
  button:disabled{opacity:.42;cursor:not-allowed;box-shadow:0 4px 0 rgba(43,43,51,.3)}
  button.go{background:var(--accent);color:#fff}
  button.go .t{color:rgba(255,255,255,.88)}
  button.bed{background:var(--ink);color:#fff}
  button.bed .t{color:rgba(255,255,255,.8)}
  button.wxact{background:#eef6ff}

  .log{font-size:14px;font-weight:600;color:var(--ink-soft);line-height:1.6;min-height:52px}
  .log b{color:var(--ink)}

  /* ---------- overlay ---------- */
  .overlay{position:fixed;inset:0;background:rgba(43,43,51,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .overlay.hide{display:none}
  .modal{background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:22px;max-width:720px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.25)}
  .modal h1{margin:0 0 4px;font-size:30px}
  .modal p.sub{margin:0 0 16px;color:var(--ink-soft);font-weight:600;font-size:15px}
  .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .pick{border:3px solid var(--ink);border-radius:18px;padding:10px;cursor:pointer;background:#fff;text-align:center;transition:transform .1s}
  .pick:hover{transform:translateY(-3px)}
  .pick svg{width:100%;height:80px;overflow:visible}
  .pick .nm{font-size:18px;margin-top:6px}
  .pick .br{font-size:12px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase}
  .pick .ds{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-top:6px;line-height:1.45}
  .score{font-size:60px;line-height:1;margin:6px 0 2px}
  .verdict{font-size:16px;font-weight:600;line-height:1.6;margin:10px 0 16px}
  .tally{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;font-size:14px;font-weight:600;margin-bottom:16px}
  .tally div{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dotted var(--line);padding:4px 0}

  /* ---------- story book ---------- */
  .story{max-width:640px}
  .story .shead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase}
  .story .sbadge{background:var(--accent-2);color:var(--ink);padding:4px 10px;border-radius:99px}
  .story h2{margin:10px 0 0;font-size:24px}
  .story .art{font-size:56px;text-align:center;margin:8px 0 2px;letter-spacing:6px}
  .storytext{font-size:30px;line-height:1.65;font-weight:800;min-height:120px;margin:6px 0 14px}
  .storytext.q{font-size:26px;min-height:0}
  .storytext .w{cursor:pointer;border-radius:7px;padding:0 2px;transition:background .15s}
  .storytext .w:hover{background:#ffe7c2}
  .storytext .w.hl{background:var(--accent-2)}
  .opts{display:grid;gap:10px;margin-bottom:10px}
  .opts button{font-size:22px;text-align:left;padding:12px 16px}
  .opts button.right{background:#dff3e4;border-color:var(--good);opacity:1}
  .opts button.wrong{background:#fde3e1;animation:nope .3s}
  @keyframes nope{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .shint{min-height:24px;font-size:17px;color:var(--ink-soft);margin-bottom:8px}
  .peek{margin-bottom:12px;font-size:17px;font-weight:600;line-height:1.6;color:var(--ink-soft)}
  .peek summary{cursor:pointer;font-weight:800;color:var(--ink)}
  .sctl{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
  .tip{margin:12px 0 0;font-size:13px;color:var(--ink-soft);font-weight:600}

  /* ---------- dog animation ---------- */
  #dogShape{transform-origin:125px 150px}
  #dogRoot{transform-origin:120px 150px;animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.02)}}
  .leg{animation:none}
  @keyframes swing{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
  @keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}
  #tail{animation:wag 1.1s ease-in-out infinite}
  #head{animation:none}

  /* poses */
  .pose-walk #dogRoot{animation:bob .5s ease-in-out infinite}
  .pose-walk .leg{animation:swing .5s ease-in-out infinite}
  .pose-walk .leg.b{animation-delay:.25s}
  .pose-walk #tail{animation-duration:.55s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .pose-run #dogRoot{animation:bob .26s ease-in-out infinite}
  .pose-run .leg{animation:swing .26s ease-in-out infinite}
  .pose-run .leg.b{animation-delay:.13s}
  .pose-run #tail{animation-duration:.3s}

  .pose-jump #dogRoot{animation:hop .6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}30%{transform:translateY(4px) scaleY(.88)}60%{transform:translateY(-46px) scaleY(1.06)}}
  .pose-jump #tail{animation-duration:.3s}

  .pose-eat #head{animation:nod .5s ease-in-out infinite;transform-origin:158px 86px}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(26deg) translateY(10px)}}
  .pose-eat #tail{animation-duration:.24s}

  .pose-dig #head{animation:nod .28s ease-in-out infinite;transform-origin:158px 86px}
  .pose-dig .leg:not(.b){animation:swing .18s linear infinite}
  .pose-dig #tail{animation-duration:.25s}

  .pose-shake #dogRoot{animation:shake .18s linear infinite}
  @keyframes shake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  .pose-swim #dogRoot{animation:swimbob 1s ease-in-out infinite}
  @keyframes swimbob{0%,100%{transform:translateY(22px) rotate(-3deg)}50%{transform:translateY(27px) rotate(2deg)}}
  .pose-swim .leg{animation:swing .3s linear infinite}
  .pose-swim .leg.b{animation-delay:.15s}
  .swimwater{display:none}
  .pose-swim .swimwater{display:block}

  .pose-sleep #dogRoot{transform:translateY(26px) rotate(-6deg) scaleY(.82);animation:snore 3s ease-in-out infinite}
  @keyframes snore{0%,100%{transform:translateY(26px) rotate(-6deg) scaleY(.82)}50%{transform:translateY(28px) rotate(-6deg) scaleY(.86)}}
  .pose-sleep #tail{animation:none;transform:rotate(-24deg)}
  .pose-sleep .eye-open,.pose-sad .eye-open{display:none}
  .pose-sleep .eye-shut,.pose-sad .eye-shut{display:block}

  .pose-sad #dogRoot{animation:none;transform:translateY(5px)}
  .pose-sad #head{transform:rotate(12deg) translateY(7px);transform-origin:158px 86px}
  .pose-sad #tail{animation:none;transform:rotate(-40deg)}

  .pose-car #dogRoot{animation:jiggle .2s linear infinite}
  @keyframes jiggle{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  .pose-car #ear{transform:rotate(-46deg)}
  .pose-car #tail{animation-duration:.3s}

  .eye-shut{display:none}

  /* breed silhouettes — on #dogShape, because #dogRoot's transform belongs to the pose animations */
  .breed-bulldog   #dogShape{transform:scale(1.06,.9)}
  .breed-dachshund #dogShape{transform:scale(1.18,.8)}
  .breed-corgi     #dogShape{transform:scale(1.06,.84)}
  .breed-poodle    #dogShape{transform:scale(.97,1.04)}
  .ear-husky,.ear-bulldog,.ear-retriever,.ear-dachshund,.ear-poodle,.ear-dalmatian,.ear-corgi{display:none}
  .breed-husky .ear-husky,.breed-bulldog .ear-bulldog,.breed-retriever .ear-retriever,
  .breed-dachshund .ear-dachshund,.breed-poodle .ear-poodle,.breed-dalmatian .ear-dalmatian,
  .breed-corgi .ear-corgi{display:block}
  .ear-dalmatian{fill:#34343d}
  .deco-poodle,.deco-dalmatian{display:none}
  .breed-poodle .deco-poodle,.breed-dalmatian .deco-dalmatian{display:block}

  @media(max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .quests{grid-template-columns:1fr}
    .scene{height:270px}
    #dog{width:190px}
    .bubble{bottom:200px;font-size:14px;max-width:88%}
    .storytext{font-size:25px}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div>
      <div class="clock" id="clock">7:00 am</div>
      <div class="phase" id="phase">Early morning</div>
    </div>
    <div class="daybar"><i id="daybar"></i></div>
    <div class="wxb"><div id="wxNow">☀️ Sunny</div><div class="wxnext" id="wxNext"></div></div>
    <div class="where" id="where">🏠 Home</div>
  </div>

  <div class="stats">
    <div class="stat s-energy" id="st-energy"><div class="k"><span>Energy</span><b>—</b></div><div class="bar"><i></i></div></div>
    <div class="stat s-happy"  id="st-happy"><div class="k"><span>Happy</span><b>—</b></div><div class="bar"><i></i></div></div>
    <div class="stat s-full"   id="st-full"><div class="k"><span>Full</span><b>—</b></div><div class="bar"><i></i></div></div>
    <div class="stat s-clean"  id="st-clean"><div class="k"><span>Clean</span><b>—</b></div><div class="bar"><i></i></div></div>
  </div>

  <div class="scene home" id="scene">
    <div id="stars"></div>
    <div class="sun" id="sun"></div>
    <div id="moon">🌙</div>
    <div id="clouds"></div>
    <svg id="backdrop" viewBox="0 0 880 234" preserveAspectRatio="xMidYMax slice"></svg>
    <div class="ground"></div>
    <div id="gitems"></div>
    <div id="props"></div>
    <div id="stage">
      <svg id="dog" class="breed-retriever pose-idle" viewBox="0 0 250 170">
        <g id="dogShape">
        <g id="dogRoot">
          <!-- tail -->
          <g id="tail" style="transform-origin:62px 78px">
            <path d="M64 80 q-30 -4 -36 -34 q18 18 36 20 z" fill="var(--coat-dark)"/>
            <circle class="deco-poodle" cx="30" cy="45" r="11" fill="var(--belly)"/>
          </g>
          <!-- back legs -->

function route(to){
  const walk = (S.loc === "home" && to === "park") || (S.loc === "park" && to === "home");

}

function wpick(list, r){
  let x = r(), acc = 0;
  for(const [k,w] of list){ acc += w; if(x < acc) return k; }
  return list[list.length-1][0];
}
function makeWeather(r){
  const segs = [];
  let t = DAY_START, cur = wpick([["sunny",.5],["cloudy",.3],["wind",.1],["snow",.1]], r);
  while(t < DAY_END){
    const len = 120 + Math.floor(r()*4)*30;
    segs.push({from:t, to:Math.min(DAY_END, t+len), wx:cur});
    t += len;
    cur = wpick(WX_NEXT[cur], r);
  }
  // make sure every day has at least one "real" weather event to see
  if(!segs.some(s=>["rain","storm","snow","wind"].includes(s.wx))){
    const i = 1 + Math.floor(r()*(segs.length-1));
    segs[Math.min(i, segs.length-1)].wx = wpick([["rain",.35],["snow",.25],["wind",.2],["storm",.2]], r);
  }
  return segs;
}
function weatherSeg(t){ return S.weather.find(s=>t < s.to) || S.weather[S.weather.length-1]; }
function weatherAt(t){ return weatherSeg(t).wx; }

let S = null;

function mulberry32(a){
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function pick(arr, r){ return arr[Math.floor((r || Math.random)() * arr.length)]; }
function shuffle(arr, r){
  const a = arr.slice(), rnd = r || Math.random;
  for(let i=a.length-1; i>0; i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

function scatterGround(r){
  const out = {};
  for(const [k,p] of Object.entries(PLACES)){
    const n = p.indoor ? 3 : 9, items = [], puddles = [];
    for(let i=0;i<n;i++){
      const x = r() < .5 ? 2 + r()*34 : 65 + r()*32;   // keep out of the dog's patch
      const b = 6 + r()*62;
      items.push({e:pick(p.ground, r), x, b, s:Math.round(25 - b*.14)});
    }
    for(let i=0;i<3;i++) puddles.push({x:4 + r()*84, b:8 + r()*48, w:60 + r()*70});
    out[k] = {items, puddles};
  }
  return out;
}

function startGame(breedKey, seed){
  const b = BREEDS[breedKey];
  const r = mulberry32(seed != null ? seed : (Date.now() ^ (Math.random()*1e9)) >>> 0);
  S = {
    breedKey, breed:b, name:b.name,
    t:DAY_START, loc:"home", busy:false, over:false,
    energy:78, happy:62, full:46, clean:72,
    sinceExercise:0, actions:0, exerciseMins:0, treats:0, washes:0, peakHappy:62,
    log:[],
    weather:makeWeather(r),
    ground:scatterGround(r),
    story:{s:pick(STORIES, r), done:false, stars:0},
    hunt:{steps:shuffle(Object.keys(CLUES), r).slice(0,3), i:0, done:false, prize:null},
    finds:[], visited:new Set(["home"]), wxSeen:new Set(), cuddledAt:-999,
    shownLoc:null, shownWx:null
  };
  document.documentElement.style.setProperty("--coat", b.coat);
  document.documentElement.style.setProperty("--coat-dark", b.dark);
  document.documentElement.style.setProperty("--belly", b.belly);
  setPose("idle", breedKey);
  $("pickOverlay").classList.add("hide");
  say(`<b>${b.name}</b> is awake, stretched, and looking at you like the day is already late. A 🗺️ treasure map is taped to the front door, and today's 📖 story is on the table.`);
  render();
}

/* ---------- helpers ---------- */
const $  = id => document.getElementById(id);
const dog = $("dog");
const clamp = v => Math.max(0, Math.min(100, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
// NB: SVG elements have a read-only .className (SVGAnimatedString) — must use setAttribute
function setPose(pose, breedKey){
  dog.setAttribute("class", `breed-${breedKey || S.breedKey} pose-${pose}`);
}
function exposedHere(){ return S.loc !== "home" && !PLACES[S.loc].indoor; }

function fmtTime(m){
  let h = Math.floor(m/60), mm = String(m%60).padStart(2,"0");
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${mm} ${ap}`;
}
function phaseName(m){
  if(m < 9*60)  return "Early morning";
  if(m < 12*60) return "Morning";
  if(m < 14*60) return "Midday";
  if(m < 16*60) return "Afternoon";
  if(m < 18*60) return "Late afternoon";
  return "Golden hour";
}

/* sky palette, lerped across the day */
const SKY = [
  [0.00, [0xf7,0xc9,0x9a], [0xfa,0xe6,0xcf]],  // dawn
  [0.18, [0xa8,0xdc,0xf0], [0xe4,0xf3,0xf8]],  // morning
  [0.50, [0x8f,0xd2,0xef], [0xdd,0xf1,0xf9]],  // midday
  [0.74, [0xf3,0xc8,0x8f], [0xfa,0xe8,0xc8]],  // afternoon gold
  [0.90, [0xe8,0x8a,0x62], [0xf6,0xc4,0x9a]],  // sunset
  [1.00, [0x4a,0x3c,0x6e], [0xa8,0x72,0x8c]]   // dusk
];
/* the colour of the light itself — multiplied over the whole scene, dog included */
const LIGHT = [
  [0.00, [255,218,186]],  // warm dawn
  [0.12, [255,240,222]],
  [0.30, [255,255,255]],  // plain daylight
  [0.62, [255,250,238]],
  [0.78, [255,226,184]],  // golden
  [0.90, [250,184,146]],  // sunset orange
  [1.00, [150,138,204]]   // blue dusk
];
function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
function mix(a,b,k){ return a.map((c,i)=>lerp(c,b[i],k)); }
const rgb = a => `rgb(${a.join(",")})`;
function sample(stops, p, col){
  p = Math.max(0, Math.min(1, p));
  for(let i=0;i<stops.length-1;i++){
    if(p <= stops[i+1][0]){
      const k = (p - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      return mix(stops[i][col], stops[i+1][col], k);
    }
  }
  return stops[stops.length-1][col];
}
function skyRGB(p){ return [sample(SKY,p,1), sample(SKY,p,2)]; }
function skyAt(p){ return skyRGB(p).map(rgb); }

/* ---------- rendering ---------- */
function render(){
  const p = Math.min(1, (S.t - DAY_START) / (DAY_END - DAY_START));
  const wxKey = weatherAt(S.t), W = WX[wxKey], place = PLACES[S.loc];

  $("clock").textContent = fmtTime(S.t);
  $("phase").textContent = phaseName(S.t);
  $("daybar").style.width = (p*100).toFixed(1)+"%";
  $("where").textContent = `${place.icon} ${place.name}`;
  $("wxNow").textContent = `${W.icon} ${W.name}`;
  const seg = weatherSeg(S.t), next = S.weather[S.weather.indexOf(seg)+1];
  $("wxNext").textContent = next && next.wx !== wxKey ? `then ${WX[next.wx].icon} at ${fmtTime(next.from)}` : "for the rest of the day";

  const scene = $("scene");
  scene.className = `scene ${S.loc} wx-${wxKey}${place.indoor ? " indoor" : ""}`;
  if(S.shownLoc !== S.loc){ buildPlace(); S.shownLoc = S.loc; }
  if(S.shownWx !== wxKey){
    buildWeather(wxKey);
    if(S.shownWx) say(`<b>${W.icon} ${W.name}.</b> ${WX_SAY[wxKey]}`);
    S.shownWx = wxKey; S.wxSeen.add(wxKey);
  }

  // sky, darkened by the weather
  const [top,bot] = skyRGB(p).map(c => mix(c, W.to, W.mix));
  scene.style.background = `linear-gradient(${rgb(top)}, ${rgb(bot)})`;
  scene.style.setProperty("--skyTop", rgb(top));

  // sun arcs across and sets; clouds hide it
  const sun = $("sun");
  sun.style.left = (10 + p*70) + "%";
  sun.style.top  = (150 - Math.sin(p*Math.PI)*130) + "px";
  sun.style.background = p > .8 ? "#ff9d5c" : "#fff3c4";
  sun.style.opacity = (p > .97 ? 0 : 1) * W.sun;
  const night = Math.max(0, Math.min(1, (p - .86) / .12));
  $("stars").style.opacity = night * (W.mix < .3 ? 1 : .15);
  $("moon").style.opacity  = night * (W.mix < .45 ? 1 : .3);

  // the light: time of day × weather; indoors mostly lamp-light
  let light = sample(LIGHT, p, 1).map((c,i)=>Math.round(c * W.light[i] / 255));
  if(place.indoor) light = mix(sample(LIGHT, p, 1), [255,246,230], .7);
  $("tint").style.background = rgb(light);
  const dim = p > .8 || W.mix >= .5;
  scene.style.setProperty("--win", dim ? "#ffd66b" : "#cfe3ee");
  scene.style.setProperty("--glow", place.indoor ? .8 : (p > .82 ? .9 : W.mix >= .5 ? .55 : 0));

  // stat bars
  ["energy","happy","full","clean"].forEach(k=>{
    const el = $("st-"+k);
    el.querySelector("i").style.width = S[k]+"%";
    el.querySelector("b").textContent = Math.round(S[k]);
    el.classList.toggle("low", S[k] < 30);
  });

  drawButtons();
  if(!S.busy && !S.over){ setPose(idlePose()); showCue(); }
}

function buildPlace(){
  const place = PLACES[S.loc], g = S.ground[S.loc];
  $("backdrop").innerHTML = BACKDROPS[S.loc];
  $("props").innerHTML = place.props
    .map(([e,x,c]) => `<div class="prop ${c}" style="left:${x}%">${e}</div>`).join("");
  $("gitems").innerHTML =
    g.puddles.map(u=>`<div class="puddle" style="left:${u.x}%;bottom:${u.b}px;width:${u.w}px"></div>`).join("") +
    g.items.map(i=>`<div class="gi" style="left:${i.x.toFixed(1)}%;bottom:${i.b.toFixed(0)}px;font-size:${i.s}px">${i.e}</div>`).join("");
}

function buildWeather(wx){
  const W = WX[wx], c = $("clouds"), f = $("wx");
  c.innerHTML = ""; f.innerHTML = "";
  for(let i=0;i<W.clouds;i++){
    const el = document.createElement("div");
    el.className = "cloud " + W.kind;
    const dur = (W.fast ? 22 : 70) + Math.random()*40;
    el.style.cssText = `top:${14+Math.random()*(W.mix > .3 ? 60 : 90)}px;--s:${(.6+Math.random()*.7).toFixed(2)};animation-duration:${dur}s;animation-delay:-${(Math.random()*dur).toFixed(1)}s`;
    c.appendChild(el);
  }
  const add = (cls, css, txt) => { const el = document.createElement("div"); el.className = cls; el.style.cssText = css; if(txt) el.textContent = txt; f.appendChild(el); };
  if(wx === "rain" || wx === "storm"){
    const n = wx === "storm" ? 110 : 70;
    for(let i=0;i<n;i++) add("drop", `left:${-5+Math.random()*112}%;animation-duration:${(.45+Math.random()*.35).toFixed(2)}s;animation-delay:-${Math.random().toFixed(2)}s`);
  }
  if(wx === "snow"){
    for(let i=0;i<55;i++) add("flake", `left:${Math.random()*100}%;font-size:${8+Math.random()*10}px;animation-duration:${(4+Math.random()*4).toFixed(1)}s;animation-delay:-${(Math.random()*8).toFixed(1)}s`, Math.random()<.5 ? "❄" : "●");
  }
  if(wx === "wind" || wx === "storm"){
    for(let i=0;i<(wx === "wind" ? 10 : 4);i++) add("leaf", `top:${20+Math.random()*240}px;animation-duration:${(3+Math.random()*3).toFixed(1)}s;animation-delay:-${(Math.random()*6).toFixed(1)}s`, Math.random()<.5 ? "🍂" : "🍃");
    for(let i=0;i<8;i++) add("gust", `top:${20+Math.random()*260}px;animation-duration:${(1.2+Math.random()*1.2).toFixed(1)}s;animation-delay:-${(Math.random()*2).toFixed(1)}s`);
  }
}

/* what he looks like when you're not telling him to do anything */
function idlePose(){
  if(weatherAt(S.t) === "storm" && !PLACES[S.loc].indoor) return "sad";
  if(S.energy < 22) return "sad";
  if(S.happy  < 28) return "sad";
  return "idle";
}

/* the behavioural half of the feedback: he tells you before the bars do */
function currentCue(){
  const cues = [], wx = weatherAt(S.t);
  if(wx === "storm" && !PLACES[S.loc].indoor)
                   cues.push(["⛈️", S.loc === "home" ? "He's under the table, flinching at every rumble. A cuddle would help."
                                                      : "He's pressed against your legs, trembling. He wants to be indoors."]);
  if(S.full  < 30) cues.push(S.loc === "home"
      ? ["🍖", "He is sitting by the bowl, staring into it with intent."]
      : ["🍖", "He keeps checking your pockets. There is nothing in your pockets."]);
  if(S.energy< 25) cues.push(["😮‍💨", "Flat out on his side, panting. That's the tank empty."]);
  if(S.clean < 35) cues.push(["🦨", "He's scratching, and there's a smell you're choosing to ignore."]);
  if(S.sinceExercise > 170*(1/S.breed.exerciseNeed))
                   cues.push(["🚪", "He keeps pacing to the door and looking back at you."]);
  if(S.happy < 30) cues.push(["😔", "Chin on the floor. Not sulking exactly. Sulking."]);
  if(!cues.length && exposedHere()){
    if(wx === "snow") cues.push(["❄️", "He's snapping at snowflakes and missing every one."]);
    if(wx === "rain") cues.push(["🌧️", "He shakes off the rain and gives you a pointed look."]);
    if(wx === "wind") cues.push(["🌬️", "Ears inside out, nose working overtime. The wind smells of everything."]);
  }
  if(!cues.length && S.happy > 78 && S.energy > 60)
                   cues.push(["✨", "Bouncing on his front paws, ready for absolutely anything."]);
  return cues[0] || null;
}
function showCue(){
  const c = currentCue();
  const b = $("bubble");
  if(c){ b.textContent = c[0]+"  "+c[1]; b.className = "bubble show"; }
  else  { b.className = "bubble"; }
}
function speak(text, bad){
  const b = $("bubble");
  b.textContent = text;
  b.className = "bubble show" + (bad ? " no" : "");
}

function say(html){
  S.log.unshift(html);
  S.log = S.log.slice(0,4);
  $("log").innerHTML = S.log.map((l,i)=> i ? `<div style="opacity:.55">${l}</div>` : `<div>${l}</div>`).join("");
}

function floatFx(emoji, n){
  for(let i=0;i<(n||1);i++){
    const el = document.createElement("div");
    el.className = "float";
    el.textContent = emoji;
    el.style.left = (38 + Math.random()*26) + "%";
    el.style.bottom = (150 + Math.random()*40) + "px";
    el.style.animationDelay = (i*0.18)+"s";
    $("scene").appendChild(el);
    setTimeout(()=>el.remove(), 1900 + i*180);
  }
}
function throwItem(emoji){
  const el = document.createElement("div");
  el.className = "thrown"; el.textContent = emoji;
  $("scene").appendChild(el);
  setTimeout(()=>el.remove(), 1400);
  setTimeout(()=>$("stage").style.left = "76%", 350);
  setTimeout(()=>$("stage").style.left = "50%", 1000);
}
function dropItems(emoji, n){
  for(let i=0;i<n;i++){
    const el = document.createElement("div");
    el.className = "falling"; el.textContent = emoji;
    el.style.left = (36 + Math.random()*30) + "%";
    el.style.animationDelay = (i*0.16) + "s";
    $("scene").appendChild(el);
    setTimeout(()=>el.remove(), 1500 + i*160);
  }
}

/* ---------- buttons ---------- */
function timeLeft(){ return DAY_END - S.t; }

function drawButtons(){
  const wx = weatherAt(S.t), place = PLACES[S.loc];
  $("actTitle").textContent = S.loc === "home" ? "What now? · at home" : `What now? · at the ${place.name.toLowerCase()}`;
  const wrap = $("actions");
  wrap.innerHTML = "";
  ACTIONS.filter(a => a.locs.includes(S.loc) && (!a.weather || a.weather.includes(wx))).forEach(a=>{
    const noTime = a.mins > timeLeft();
    const scared = wx === "storm" && a.outside && !place.indoor;
    const btn = document.createElement("button");
    if(a.weather) btn.className = "wxact";
    let tag = `${a.mins} min${a.weather ? " · " + WX[wx].icon + " only today" : ""}`;
    if(noTime) tag = "not enough daylight";
    else if(scared) tag += " · ⛈️ he's scared";
    btn.innerHTML = `${a.icon} ${a.label}<span class="t">${tag}</span>`;
    btn.disabled = S.busy || S.over || noTime;
    btn.onclick = ()=>doAction(a);
    wrap.appendChild(btn);
  });

  const tw = $("travel");
  tw.innerHTML = "";
  Object.keys(PLACES).filter(k => k !== S.loc).map(route).sort((a,b)=>a.mins-b.mins).forEach(r=>{
    const P = PLACES[r.to];
    const btn = document.createElement("button");
    btn.className = "go";
    btn.innerHTML = `${P.icon} ${P.name}<span class="t">${r.mins} min ${r.walk ? "walk" : "drive"} · ${P.hint}</span>`;
    btn.disabled = S.busy || S.over || r.mins > timeLeft();
    btn.onclick = ()=>doTravel(r);
    tw.appendChild(btn);
  });
  const bed = document.createElement("button");
  bed.className = "bed";
  bed.innerHTML = `🌙 Call it a day<span class="t">put him to bed now</span>`;
  bed.disabled = S.busy || S.over;
  bed.onclick = ()=>endDay(true);
  tw.appendChild(bed);

  drawQuests();
}

function drawQuests(){
  const st = S.story, qs = $("qStory");
  qs.className = "quest" + (st.done ? " done" : "");
  if(st.done){
    qs.innerHTML = `<div class="qi">📖</div><div class="qt"><b>Today's story · read</b>“${esc(fill(st.s.title))}” ${"⭐".repeat(st.stars)}${"☆".repeat(st.s.qs.length - st.stars)}</div>`;
  } else {
    const late = 20 > timeLeft();
    qs.innerHTML = `<div class="qi">📖</div><div class="qt"><b>Today's story</b>“${esc(fill(st.s.title))}” — read it before bedtime.</div>`;
    const b = document.createElement("button");
    b.innerHTML = `Read it<span class="t">${late ? "at bedtime" : "20 min"}</span>`;
    b.disabled = S.busy || S.over || late;
    b.onclick = doStory;
    qs.appendChild(b);
  }

  const h = S.hunt, qh = $("qHunt");
  qh.className = "quest" + (h.done ? " done" : "");
  if(h.done){
    qh.innerHTML = `<div class="qi">${h.prize[0]}</div><div class="qt"><b>Treasure hunt · found it!</b>He dug up ${esc(h.prize[1])}.</div>`;
  } else {
    const last = h.i === h.steps.length - 1;
    qh.innerHTML = `<div class="qi">🗺️</div><div class="qt"><b>Treasure hunt · clue ${h.i+1} of ${h.steps.length}</b><span class="clue">${last ? "X marks the spot! " : ""}${esc(CLUES[h.steps[h.i]].go)}</span></div>`;
    const b = document.createElement("button");
    b.innerHTML = `🐽 Sniff here<span class="t">15 min</span>`;
    b.disabled = S.busy || S.over || 15 > timeLeft();
    b.onclick = doSniff;
    qh.appendChild(b);
  }
}

/* ---------- the clock: passive drift ---------- */
function passTime(mins, wx){
  wx = wx || weatherAt(S.t);
  const calm = S.t - S.cuddledAt < 120;
  S.t += mins;
  S.full  = clamp(S.full  - mins*0.055);
  S.clean = clamp(S.clean - mins*0.012*S.breed.dirtRate);
  S.sinceExercise += mins;

  // under-exercised dogs get restless, and it costs happiness
  const tolerance = 170 / S.breed.exerciseNeed;
  if(S.sinceExercise > tolerance){
    S.happy = clamp(S.happy - (mins*0.035)*S.breed.exerciseNeed);
  }
  // being hungry or filthy erodes mood on its own
  if(S.full  < 25) S.happy = clamp(S.happy - mins*0.03);
  if(S.clean < 25) S.happy = clamp(S.happy - mins*0.015);

  // weather: rain muddies an exposed dog; a storm frays his nerves unless he's indoors or cuddled
  if(exposedHere() && (wx === "rain" || wx === "storm")) S.clean = clamp(S.clean - mins*0.03*S.breed.dirtRate);
  if(wx === "storm" && !PLACES[S.loc].indoor)
    S.happy = clamp(S.happy - mins*(exposedHere() ? 0.05 : (calm ? 0 : 0.02)));
}

function applyEffects(eff, id, outside, wx){
  const b = S.breed;
  let joy = (b.joy && b.joy[id]) || 1, eMul = b.energyDrain, dMul = b.dirtRate;
  if(outside && !PLACES[S.loc].indoor){
    if(wx === "rain" || wx === "storm") dMul *= 1.7;
    if(wx === "snow"){ eMul *= 1.15; dMul *= .8; joy *= b.snow || 1; }
    if(wx === "wind") eMul *= 1.1;
  }
  if(id === "cuddle" && wx === "storm"){ joy *= 1.6; S.cuddledAt = S.t; }
  if(eff.energy) S.energy = clamp(S.energy + (eff.energy < 0 ? eff.energy*eMul : eff.energy));
  if(eff.happy)  S.happy  = clamp(S.happy  + (eff.happy  > 0 ? eff.happy*joy : eff.happy));
  if(eff.full)   S.full   = clamp(S.full   + eff.full);
  if(eff.clean)  S.clean  = clamp(S.clean  + (eff.clean < 0 ? eff.clean*dMul : eff.clean));
  S.peakHappy = Math.max(S.peakHappy, S.happy);
}

/* ---------- doing things ---------- */
function refuse(line, stat){
  S.busy = true;
  setPose("sad");
  speak("🚫  " + line, true);
  $("st-"+stat).classList.add("pulse");
  setTimeout(()=>$("st-"+stat).classList.remove("pulse"), 1500);
  say(`<b>No.</b> ${line}`);
  setTimeout(()=>{ S.busy = false; render(); }, 1500);
}

function doAction(a){
  if(S.busy || S.over) return;
  const wx = weatherAt(S.t);

  // a thunderstorm is a visible reason, same as a visible stat
  if(wx === "storm" && a.outside && !PLACES[S.loc].indoor)
    return refuse("He's pressed flat against your legs, trembling. Not while the sky is doing that.", "happy");
  // needs-based refusal — he has a body and it has opinions
  const refusal = a.gate(S);
  if(refusal) return refuse(refusal, a.stat || "energy");

  const ctx = a.pick ? a.pick() : {};
  const line = typeof a.say === "function" ? a.say(S, ctx) : a.say;
  S.busy = true;
  S.actions++;
  setPose(a.pose);
  if(a.fx) floatFx(a.fx, 3);
  if(a.anim) a.anim(ctx);
  speak(`${a.icon}  ${line}`);

  const dur = a.id === "nap" ? 2200 : 1500;
  setTimeout(()=>{
    passTime(a.mins, wx);
    applyEffects(Object.assign({}, a.eff, (a.effAt && a.effAt[S.loc]) || {}), a.id, a.outside, wx);
    if(a.exercise){ S.exerciseMins += a.exercise; S.sinceExercise = 0; }
    if(a.id === "treat"){ S.treats++; if(S.treats > 3) S.happy = clamp(S.happy - (S.treats-3)*2); }
    if(a.id === "wash")  S.washes++;
    if(a.done) a.done(ctx);
    S.busy = false;
    say(`<b>${a.label}.</b> ${line}`);
    render();
    if(S.t >= DAY_END) endDay(false);
  }, dur);
}

function doTravel(r){
  if(S.busy || S.over) return;
  const wx = weatherAt(S.t);
  S.busy = true;
  setPose(r.pose);
  floatFx(r.walk ? "🐾" : "💨", 3);
  speak((r.walk ? "🐾  Walking to " : "🚗  Driving to ") + PLACES[r.to].to + "…");
  $("stage").style.left = r.walk ? "26%" : "78%";

  setTimeout(()=>{
    passTime(r.mins, wx);
    const soaked = r.walk && (wx === "rain" || wx === "storm") ? -8 : 0;
    applyEffects({energy:r.energy, happy:r.happy, clean:r.clean + soaked}, "travel", false, wx);
    if(r.exercise){ S.exerciseMins += r.exercise; S.sinceExercise = 0; }
    S.loc = r.to;
    S.visited.add(r.to);
    S.busy = false;
    $("stage").style.left = "50%";
    say(`<b>${r.walk ? "Walked" : "Drove"} to ${PLACES[r.to].to}.</b> ${PLACES[r.to].arrive}`);
    render();
    if(S.t >= DAY_END) endDay(false);
  }, 1600);
}

/* the treasure hunt: he sniffs, you read the clue and pick the place */
function doSniff(){
  if(S.busy || S.over || S.hunt.done) return;
  const wx = weatherAt(S.t), h = S.hunt;
  if(wx === "storm" && exposedHere())
    return refuse("He won't put his nose to the ground in this. He wants to be indoors.", "happy");
  if(S.energy < 12) return refuse("He sniffs once, sighs, and lies down on the clue. Too tired to detect.", "energy");

  S.busy = true;
  setPose("dig");
  floatFx("👃", 2);
  speak("🐽  Nose to the ground…");
  setTimeout(()=>{
    passTime(15, wx);
    applyEffects({energy:-5, happy:5}, "sniff", exposedHere(), wx);
    const target = h.steps[h.i];
    if(S.loc === target){
      h.i++;
      if(h.i >= h.steps.length){
        h.done = true;
        h.prize = pick(PRIZES);
        applyEffects({happy:25}, "treasure");
        floatFx("✨", 6); floatFx(h.prize[0], 3);
        speak(`🧰  He digs like a maniac and hits wood. A treasure chest! Inside: ${h.prize[1]}!`);
        say(`<b>TREASURE!</b> ${S.name} dug up a chest ${CLUES[target].spot}. Inside: ${h.prize[0]} ${h.prize[1]}.`);
      } else {
        applyEffects({happy:6}, "clue");
        floatFx("📜", 3);
        speak(`📜  He found a note ${CLUES[target].spot}! Read the next clue.`);
        say(`<b>Clue found!</b> ${CLUES[target].spot[0].toUpperCase() + CLUES[target].spot.slice(1)}. Next: “${CLUES[h.steps[h.i]].go}”`);
      }
    } else {
      speak("🐽  Nothing here but a very interesting smell.");
      say(`<b>No clue here.</b> Read the clue again: “${CLUES[target].go}”`);
    }
    S.busy = false;
    render();
    if(S.t >= DAY_END) endDay(false);
  }, 1500);
}

/* ---------- story book ---------- */
const canSpeak = "speechSynthesis" in window;
let ST = null;

function fill(t){
  const [he,him,his] = S.breed.pro, cap = s => s[0].toUpperCase() + s.slice(1);
  return t.replace(/\{name\}/g, S.name).replace(/\{He\}/g, cap(he)).replace(/\{he\}/g, he)
          .replace(/\{His\}/g, cap(his)).replace(/\{his\}/g, his).replace(/\{him\}/g, him);
}
function wordSpans(text){
  let html = "", c = 0;
  text.split(/(\s+)/).forEach(tok=>{
    if(!tok) return;
    html += /^\s+$/.test(tok) ? tok : `<span class="w" data-c="${c}">${esc(tok)}</span>`;
    c += tok.length;
  });
  return html;
}
function speakText(text, el){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = .8; u.lang = "en-US";
  if(el){
    const spans = [...el.querySelectorAll(".w")];
    u.onboundary = e => {
      let cur = null;
      for(const s of spans) if(+s.dataset.c <= e.charIndex) cur = s;
      spans.forEach(s => s.classList.toggle("hl", s === cur));
    };
    u.onend = () => spans.forEach(s => s.classList.remove("hl"));
  }
  speechSynthesis.speak(u);
}
function stopSpeech(){ if(canSpeak) speechSynthesis.cancel(); }

function openStory(bedtime, done){
  S.busy = true;
  drawButtons();
  const s = S.story.s, lines = s.text.map(fill), pages = [];
  for(let i=0;i<lines.length;i+=2) pages.push(lines.slice(i,i+2).join(" "));
  ST = {s, pages, page:0, q:-1, stars:0, tried:false, bedtime, done};
  $("storyBadge").textContent = bedtime ? "🌙 Bedtime story" : "📖 Today's story";
  $("storyTitle").textContent = fill(s.title);
  $("storyPeekText").textContent = lines.join(" ");
  $("storyRead").style.display = canSpeak ? "" : "none";
  $("storyTip").style.display = canSpeak ? "" : "none";
  $("storyOverlay").classList.remove("hide");
  showStoryPage();
}
function showStoryPage(){
  stopSpeech();
  $("storyProg").textContent = `Page ${ST.page+1} of ${ST.pages.length}`;
  $("storyArt").textContent = ST.s.art;
  $("storyText").className = "storytext";
  $("storyText").innerHTML = wordSpans(ST.pages[ST.page]);
  $("storyOpts").innerHTML = "";
  $("storyHint").textContent = "";
  $("storyPeek").style.display = "none";
  $("storyNext").style.display = "";
  $("storyNext").textContent = ST.page < ST.pages.length-1 ? "Next page →" : "Questions →";
}
function showQuestion(){
  stopSpeech();
  const [q, opts] = ST.s.qs[ST.q];
  ST.tried = false;
  $("storyProg").textContent = `Question ${ST.q+1} of ${ST.s.qs.length}`;
  $("storyArt").textContent = "❓";
  $("storyText").className = "storytext q";
  $("storyText").innerHTML = wordSpans(fill(q));
  const box = $("storyOpts");
  box.innerHTML = "";
  shuffle(opts.map((o,i)=>[fill(o), i === 0])).forEach(([txt, right])=>{
    const b = document.createElement("button");
    b.textContent = txt;
    b.onclick = () => answer(b, right);
    box.appendChild(b);
  });
  $("storyHint").textContent = "";
  $("storyPeek").style.display = ""; $("storyPeek").open = false;
  $("storyNext").style.display = "none";
}
function answer(btn, right){
  if(right){
    btn.classList.add("right");
    if(!ST.tried) ST.stars++;
    [...$("storyOpts").children].forEach(b => b.disabled = true);
    $("storyHint").textContent = ST.tried ? "Yes! You found it." : pick(["Yes! ⭐","Great reading! ⭐","You got it! ⭐"]);
    setTimeout(()=>{ ST.q++; ST.q < ST.s.qs.length ? showQuestion() : showStoryEnd(); }, 900);
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    ST.tried = true;
    $("storyHint").textContent = "Not quite — try again! You can peek at the story.";
  }
}
function showStoryEnd(){
  const n = ST.s.qs.length;
  $("storyProg").textContent = "All done!";
  $("storyArt").textContent = "⭐".repeat(ST.stars) + "☆".repeat(n - ST.stars);
  $("storyText").className = "storytext q";
  $("storyText").textContent = ST.stars === n ? "Perfect! You read it all by yourself."
                             : ST.stars > 0   ? `You got ${ST.stars} of ${n} on the first try. Good reading!`
                             : "You kept trying and found every answer. Well done!";
  $("storyOpts").innerHTML = "";
  $("storyHint").textContent = "";
  $("storyPeek").style.display = "none";
  $("storyNext").style.display = "";
  $("storyNext").textContent = ST.bedtime ? "Good night →" : "Back to the day →";
}
function finishStory(){
  stopSpeech();
  $("storyOverlay").classList.add("hide");
  const done = ST.done, stars = ST.stars;
  ST = null;
  done(stars);
}
$("storyNext").onclick = ()=>{
  if(ST.q < 0){
    if(ST.page < ST.pages.length-1){ ST.page++; showStoryPage(); }
    else { ST.q = 0; showQuestion(); }
  } else if(ST.q >= ST.s.qs.length) finishStory();
};
$("storyRead").onclick = ()=> speakText($("storyText").textContent, $("storyText"));
$("storyText").addEventListener("click", e=>{
  const w = e.target.closest(".w");
  if(w) speakText(w.textContent.replace(/[^A-Za-z']/g, ""));
});

function doStory(){
  if(S.busy || S.over || S.story.done) return;
  openStory(false, stars=>{
    S.story.done = true; S.story.stars = stars;
    passTime(20);
    applyEffects({happy:10, energy:5}, "story");
    floatFx("📖", 2);
    say(`<b>Story time.</b> ${S.name} listened to “${fill(S.story.s.title)}” with ${S.breed.pro[2]} head on your knee. ${"⭐".repeat(stars)}`);
    S.busy = false;
    render();
    if(S.t >= DAY_END) endDay(false);
  });
}

/* ---------- dusk ---------- */
function endDay(early){
  if(S.over) return;
  S.over = true; S.busy = true;
  drawButtons();
  if(!S.story.done){
    // the story is the one thing every day needs — if it wasn't read, it becomes the bedtime story
    setPose("idle");
    speak("📖  Not without a bedtime story. He's brought you the book.");
    setTimeout(()=>openStory(true, stars=>{
      S.story.done = true; S.story.stars = stars;
      goToSleep(early);
    }), 1100);
    return;
  }
  goToSleep(early);
}

function goToSleep(early){
  setPose("sleep");
  floatFx("💤", 4);
  speak("💤  Out like a light.");
  drawButtons();

  setTimeout(()=>{
    const storyBonus = S.story.stars * 2;
    const treasureBonus = S.hunt.done ? 8 : 0;
    const score = Math.round(
      S.happy*0.40 + S.energy*0.18 + S.full*0.21 + S.clean*0.21
    ) + Math.min(10, Math.floor(S.exerciseMins/30)*2) + storyBonus + treasureBonus;

    const stats = [["happy",S.happy,"happiness"],["energy",S.energy,"rest"],
                   ["full",S.full,"food"],["clean",S.clean,"grooming"]];
    stats.sort((a,b)=>a[1]-b[1]);
    const worst = stats[0];

    const notes = {
      happy:  "He had a flat day. More walking, more fetch, fewer baths.",
      energy: "You ran him into the ground. A nap earlier would have bought you a better evening.",
      full:   "He went to bed hungry. Feeding is cheap — twenty minutes and it lifts three stats.",
      clean:  "He's asleep and he smells. A bath — or the pool slide — would have fixed that."
    };
    let verdict = notes[worst[0]];
    if(score >= 85) verdict = "Near-perfect day. He's asleep on his side with his paws twitching. " + (worst[1] < 60 ? notes[worst[0]] : "Nothing to fix.");
    else if(score >= 70) verdict = "A good day by any dog's reckoning. " + notes[worst[0]];
    else if(score < 45) verdict = "A thin day. " + notes[worst[0]];
    if(S.hunt.done) verdict += ` And he found the treasure: ${S.hunt.prize[1]}.`;

    $("endTitle").textContent = early ? `${S.name} turns in early` : `${S.name} is asleep`;
    $("endSub").textContent = `${S.breed.label} · ${fmtTime(S.t)} · ${S.actions} things done · ${S.exerciseMins} min of exercise`;
    $("endScore").textContent = score;
    $("endVerdict").textContent = verdict;
    const n = S.story.s.qs.length;
    $("endTally").innerHTML = [
      ["Happiness", Math.round(S.happy)], ["Energy left", Math.round(S.energy)],
      ["Fullness", Math.round(S.full)],   ["Cleanliness", Math.round(S.clean)],
      ["Exercise", S.exerciseMins+" min"],["Treats", S.treats],
      ["Story", "⭐".repeat(S.story.stars) + "☆".repeat(n - S.story.stars)],
      ["Treasure", S.hunt.done ? S.hunt.prize[0] + " found" : `${S.hunt.i} of ${S.hunt.steps.length} clues`],
      ["Places visited", `${S.visited.size} of ${Object.keys(PLACES).length}`],
      ["Weather", [...S.wxSeen].map(w=>WX[w].icon).join(" ")],
      ["Dug up", S.finds.length ? S.finds.join(" ") : "—"]
    ].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("");
    $("endOverlay").classList.remove("hide");
  }, 1800);
}

/* ---------- breed picker ---------- */
const EARS = {
  husky:     'M170 40 l6 -38 l24 26 z',
  retriever: 'M168 34 q-16 8 -12 40 q16 6 24 -14 z',
  bulldog:   'M168 36 q-14 2 -12 24 q14 2 20 -12 z',
  dachshund: 'M168 34 q-20 6 -16 50 q18 4 26 -24 z',
  poodle:    'M166 34 q-22 10 -16 46 q6 8 16 2 q10 -6 12 -34 z',
  dalmatian: 'M168 34 q-16 8 -12 36 q16 6 24 -12 z',
  corgi:     'M166 42 l2 -44 l32 30 z'
};
const SHAPES = {bulldog:[1.06,.9], dachshund:[1.18,.8], corgi:[1.06,.84], poodle:[.97,1.04]};
function miniDog(b, key){
  const [sx,sy] = SHAPES[key] || [1,1];
  const spots = key === "dalmatian" ? `<g fill="#34343d"><circle cx="90" cy="78" r="6"/><circle cx="118" cy="70" r="5"/><circle cx="142" cy="86" r="4.5"/><circle cx="100" cy="98" r="4"/><circle cx="192" cy="40" r="4"/></g>` : "";
  const poms = key === "poodle" ? `<circle cx="30" cy="45" r="11" fill="${b.belly}"/><circle cx="186" cy="31" r="16" fill="${b.belly}"/>` : "";
  const earFill = key === "dalmatian" ? "#34343d" : b.dark;
  return `<svg viewBox="0 0 250 170"><g transform="translate(125 150) scale(${sx} ${sy}) translate(-125 -150)">
    <ellipse cx="112" cy="92" rx="58" ry="33" fill="${b.coat}"/>
    <ellipse cx="118" cy="104" rx="45" ry="19" fill="${b.belly}"/>
    <rect x="75" y="100" width="17" height="46" rx="8" fill="${b.dark}"/>
    <rect x="143" y="98" width="17" height="48" rx="8" fill="${b.dark}"/>
    <path d="M64 80 q-30 -4 -36 -34 q18 18 36 20 z" fill="${b.dark}"/>
    <path d="M150 96 q4 -30 26 -36 l14 26 z" fill="${b.coat}"/>
    ${poms}
    <ellipse cx="190" cy="56" rx="31" ry="27" fill="${b.coat}"/>
    <ellipse cx="216" cy="66" rx="21" ry="14" fill="${b.belly}"/>
    <ellipse cx="234" cy="60" rx="8" ry="6.5" fill="#2b2b33"/>
    <circle cx="203" cy="52" r="5.5" fill="#2b2b33"/>
    ${spots}
    <path d="${EARS[key]}" fill="${earFill}"/>
  </g></svg>`;
}
$("picks").innerHTML = Object.entries(BREEDS).map(([k,b])=>`
  <div class="pick" onclick="startGame('${k}')">
    ${miniDog(b,k)}
    <div class="nm">${b.name}</div>
    <div class="br">${b.label}</div>
    <div class="ds">${b.desc}</div>
  </div>`).join("");
</script>
